<figcaption style="margin-top:14px;color:#9aa3b8;font-size:13px;max-width:393px;line-height:1.65;text-align:left"><b style="color:#e8eaf0">DogChaseBones — locked stage.</b><br><span style="color:#4d96ff">&#9647; dashed</span> camera fit rect · <span style="color:#c9782f">&#9632;</span> block group · <span style="color:#464b5c">&#9632;</span> static wall · <span style="color:#f2efe6">&#9632;</span> bone · <span style="color:#f2c53d">&#9632;</span> bee · <span style="color:#8c5a3c">&#9632;</span> dog queue<br><br>The camera fits the grid inside the dashed rect using the four margins from <code>gameSettings.json</code>. Queues live in those margins and may run off-screen; a <code>xN</code> badge at each entry shows how many dogs are left. The editor places content in grid cells only — it never edits this stage.</figcaption>
